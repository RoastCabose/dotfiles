# Roasted Theme for Helix, customized Atelier Forest Dark

# Code
attribute = "red"
keyword = "violet"
"keyword.directive" = "red" # -- preprocessor comments (#if in C)
namespace = "violet"
punctuation = "grey"
"punctuation.delimiter" = "grey"
operator = "grey"
special = "bright-green"
"variable.other.member" = "bright-white"
variable = "bright-white"
"variable.parameter" = { fg = "red", modifiers = ["italic"] }
"variable.builtin" = "magenta"
type = "yellow"
constructor = "shock"
function = "blue"
"function.builtin" = "bright-white"
tag = "violet"
comment = { fg = "sirocco", modifiers = ["italic"]}
constant = "bright-white"
"constant.builtin" = "bright-white"
string = "green"
"constant.numeric" = "orange"
"constant.character.escape" = "bright-green"
# used for lifetimes
label = "bright-green"
tabstop = { modifiers = ["italic"], bg = "dark-brown" }

# Markup
"markup.heading" = "orange"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "silver", modifiers = ["underlined"] }
"markup.link.text" = "violet"
"markup.raw" = "violet"

# Git Diff
"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "blue"

# UI
"ui.background" = { bg = "black-brown" }
"ui.background.separator" = { fg = "grey-brown" }
"ui.linenr" = { fg = "grey-brown" }
"ui.linenr.selected" = { fg = "orange" }
"ui.statusline" = { fg = "orange", bg = "dark-brown" }
"ui.statusline.inactive" = { fg = "red", bg = "dark-brown" }
"ui.popup" = { bg = "dark-brown" }
"ui.window" = { fg = "dark-brown" }
"ui.help" = { bg = "orange", fg = "black-brown" }
"ui.text" = { fg = "grey" }
"ui.text.focus" = { fg = "bright-white" }
"ui.text.inactive" = "sirocco"
"ui.text.directory" = { fg = "orange" }
"ui.virtual" = { fg = "grey-brown" }
"ui.virtual.ruler" = { bg = "dark-brown" }
"ui.virtual.jump-label" = { fg = "red", modifiers = ["bold"] }

"ui.virtual.indent-guide" = { fg = "grey-brown" }

"ui.selection" = { bg = "dark-brown" }
"ui.selection.primary" = { bg = "grey-brown2" }
"ui.cursor.select" = { bg = "cyan" }
"ui.cursor.insert" = { bg = "bright-white" }
"ui.cursor.primary.select" = { bg = "violet" }
"ui.cursor.primary.insert" = { bg = "bright-white" }
"ui.cursor.match" = { fg = "black-brown", bg = "grey-brown" }
"ui.cursor" = { modifiers = ["reversed"] }
"ui.cursorline.primary" = { bg = "dark-brown" }
"ui.highlight" = { bg = "violet" }
"ui.highlight.frameline" = { bg = "grey-brown2" }
"ui.debug" = { fg = "violet" }
"ui.debug.breakpoint" = { fg = "red" }
"ui.menu" = { fg = "grey", bg = "dark-brown" }
"ui.menu.selected" = { fg = "dark-brown", bg = "bright-white" }
"ui.menu.scroll" = { fg = "grey", bg = "grey-brown" }

"diagnostic.hint" = { underline = { color = "silver", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.warning" = { underline = { color = "shock", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

warning = "shock"
error = "red"
info = "blue"
hint = "cyan"

[palette]
black-brown = "#1b1918"      # main background
dark-brown = "#2c2421"       # highlight / cursorline bg
grey-brown2 = "#68615e"      # unused
grey-brown = "#766e6b"       # dim (line numbers, guides)
silver = "#9c9491"           # strings
grey = "#a8a19f"             # main foreground
bright-white = "#f1efee"     # brightest foreground
red = "#f22c40"              # errors
orange = "#df5320"           # orange accent (Forest's base color)
yellow = "#c38418"           # numbers
shock = "#ffdc2b"            # warnings
sirocco = "#68766e"          # comments
green = "#7b9726"            # green (builtins)
bright-green = "#b4da37"     # special / escapes
blue = "#407ee7"             # info / select cursor
cyan = "#3d97b8"             # unused
violet = "#6666ea"           # purple (keywords, tags)
magenta = "#c33ff3"          # unused
